// Bakes ECHO_API_KEY from .env into a gitignored EchoBuildConfig.java under
// src/generated/java. Expects ext.echoBuildConfigPackage.
apply from: rootProject.file('gradle/echo-env.gradle')

if (!project.ext.has('echoBuildConfigPackage') || !project.ext.echoBuildConfigPackage) {
	throw new GradleException(
			"${project.path}: echo-build-defaults.gradle requires ext.echoBuildConfigPackage")
}

def echoBuildConfigPackage = project.ext.echoBuildConfigPackage.toString()
def packagePath = echoBuildConfigPackage.replace('.', '/')
def generatedRoot = file('src/generated/java')
def outDir = file("$generatedRoot/$packagePath")
outDir.mkdirs()

def escapedKey = (project.ext.echoApiKey ?: '')
		.replace('\\', '\\\\')
		.replace('"', '\\"')

new File(outDir, 'EchoBuildConfig.java').setText("""\
package ${echoBuildConfigPackage};

/** Generated from .env ECHO_API_KEY — do not commit (gitignored under src/generated/). */
public final class EchoBuildConfig {
	public static final String ECHO_API_KEY = "${escapedKey}";

	private EchoBuildConfig() {
	}
}
""", 'UTF-8')

sourceSets.main.java.srcDir generatedRoot
