// Bakes release Echo API key into a generated EchoBuildConfig for non-Android launchers.
// Expects ext.echoBuildConfigPackage (e.g. desktop / ios launcher package).
//
// Key resolution (first non-empty wins), same as Android release:
//   1) -PECHO_API_KEY_RELEASE / project property
//   2) process environment ECHO_API_KEY_RELEASE
//   3) root .env ECHO_API_KEY_RELEASE
//   4) same chain for ECHO_API_KEY
//
// Runtime precedence stays: test override > process env > dotenv > this build default.

def loadDotEnvFile(File file) {
	def values = [:]
	if (file == null || !file.isFile()) {
		return values
	}
	file.eachLine('UTF-8') { line ->
		def trimmed = line.trim()
		if (trimmed.isEmpty() || trimmed.startsWith('#')) {
			return
		}
		def separator = trimmed.indexOf('=')
		if (separator <= 0) {
			return
		}
		def key = trimmed.substring(0, separator).trim()
		def value = trimmed.substring(separator + 1).trim()
		if ((value.startsWith('"') && value.endsWith('"'))
				|| (value.startsWith("'") && value.endsWith("'"))) {
			value = value.substring(1, value.length() - 1)
		}
		values[key] = value
	}
	return values
}

def echoEnv = loadDotEnvFile(rootProject.file('.env'))

def echoEnvOrProp = { String key ->
	def fromGradle = project.findProperty(key)
	if (fromGradle != null && fromGradle.toString().trim()) {
		return fromGradle.toString().trim()
	}
	def fromProcess = System.getenv(key)
	if (fromProcess != null && !fromProcess.trim().isEmpty()) {
		return fromProcess.trim()
	}
	def fromFile = echoEnv[key]
	if (fromFile != null && !fromFile.toString().trim().isEmpty()) {
		return fromFile.toString().trim()
	}
	return ''
}

if (!project.ext.has('echoBuildConfigPackage')
		|| !project.ext.echoBuildConfigPackage) {
	throw new GradleException(
			"${project.path}: echo-build-defaults.gradle requires ext.echoBuildConfigPackage")
}

def echoReleaseApiKey = echoEnvOrProp('ECHO_API_KEY_RELEASE')
if (!echoReleaseApiKey) {
	echoReleaseApiKey = echoEnvOrProp('ECHO_API_KEY')
}

def echoBuildConfigPackage = project.ext.echoBuildConfigPackage.toString()
def generatedDir = layout.buildDirectory.dir('generated/echoBuildConfig/java')
def packagePath = echoBuildConfigPackage.replace('.', '/')

def escapeJavaString = { String value ->
	return (value ?: '')
			.replace('\\', '\\\\')
			.replace('"', '\\"')
}

tasks.register('generateEchoBuildConfig') {
	inputs.property('echoBuildConfigPackage', echoBuildConfigPackage)
	inputs.property('echoReleaseApiKey', echoReleaseApiKey)
	outputs.dir(generatedDir)
	doLast {
		def outRoot = generatedDir.get().asFile
		def outDir = new File(outRoot, packagePath)
		outDir.mkdirs()
		def escapedKey = escapeJavaString(echoReleaseApiKey)
		new File(outDir, 'EchoBuildConfig.java').setText("""\
package ${echoBuildConfigPackage};

/** Generated by Gradle — do not edit. Release Echo API key for packaged builds. */
public final class EchoBuildConfig {
	public static final String ECHO_API_KEY = "${escapedKey}";

	private EchoBuildConfig() {
	}
}
""", 'UTF-8')
	}
}

sourceSets.main.java.srcDir(generatedDir)
tasks.named('compileJava').configure {
	dependsOn 'generateEchoBuildConfig'
}
