// Spotless + Error Prone + SpotBugs for JVM modules (not Android AGP).
// Applied from root when the `java` plugin is present.
//
// Avoid importing plugin classes here — applied scripts are compiled before
// plugin jars are on the script classpath.

apply plugin: 'com.diffplug.spotless'
apply plugin: 'net.ltgt.errorprone'
apply plugin: 'com.github.spotbugs'

dependencies {
	errorprone 'com.google.errorprone:error_prone_core:2.50.0'
	errorprone 'com.uber.nullaway:nullaway:0.13.8'
}

// --- Spotless ----------------------------------------------------------------
// Eclipse JDT formatter profile: config/spotless/eclipse-java.xml ("iatdb").
// No ratchet: IDE Save (-PspotlessIdeHook) and spotlessApply always run the same step.
spotless {
	encoding 'UTF-8'

	java {
		target 'src/*/java/**/*.java'
		// Full Eclipse XML profile (config/spotless/eclipse-java.xml).
		eclipse().configFile(rootProject.file('config/spotless/eclipse-java.xml'))
		trimTrailingWhitespace()
		endWithNewline()
	}
}

// --- Error Prone -------------------------------------------------------------
// Full SPD sources trip many ERROR-severity checks. Default: warnings only so
// compile stays green. Fail the build with: ./gradlew … -PerrorProneErrors
// Day-to-day / agent test runs: ./gradlew … -PerrorProneOff (skips EP entirely).
//
// NullAway only checks code inside the annotated packages below, so turning it
// on does not light up the unannotated base-game sources.
//
// AcknowledgeRestrictiveAnnotations lets NullAway honour @Nullable on otherwise
// unannotated code, but that support covers method parameters and return types,
// NOT fields. So @Nullable on Char.sprite is only enforced at deref sites once
// Char's own package (actors) is annotated — hence actors is listed here while
// its heavy subpackages stay unannotated. Dropping actors from this list silently
// disables every sprite-nullability check.
//
// Widen one package at a time; items is the large one still outstanding.
def nullAwayPackages = [
		'com.shatteredpixel.shatteredpixeldungeon.heroechoes',
		'com.shatteredpixel.shatteredpixeldungeon.effects',
		'com.shatteredpixel.shatteredpixeldungeon.actors'
].join(',')
def nullAwayUnannotatedSubPackages = [
		'com.shatteredpixel.shatteredpixeldungeon.actors.mobs',
		'com.shatteredpixel.shatteredpixeldungeon.actors.hero',
		'com.shatteredpixel.shatteredpixeldungeon.actors.buffs',
		'com.shatteredpixel.shatteredpixeldungeon.actors.blobs'
].join(',')
tasks.withType(JavaCompile).configureEach { compile ->
	if (project.hasProperty('errorProneOff')) {
		options.errorprone.enabled = false
		return
	}
	// Default javac -Xmaxwarns is 100; this codebase exceeds that easily.
	options.compilerArgs.addAll(['-Xmaxwarns', '5000'])
	options.errorprone {
		disableWarningsInGeneratedCode = true
		if (!project.hasProperty('errorProneErrors')) {
			allErrorsAsWarnings = true
		}
		// Explicit severity wins over allErrorsAsWarnings, so pick it here rather
		// than letting NullAway fail the default compile.
		def nullAwaySeverity = project.hasProperty('errorProneErrors') ? 'ERROR' : 'WARN'
		errorproneArgs.addAll([
				"-Xep:NullAway:${nullAwaySeverity}".toString(),
				"-XepOpt:NullAway:AnnotatedPackages=${nullAwayPackages}".toString(),
				"-XepOpt:NullAway:UnannotatedSubPackages=${nullAwayUnannotatedSubPackages}".toString(),
				'-XepOpt:NullAway:AcknowledgeRestrictiveAnnotations=true'
		])
	}
}

// --- SpotBugs ----------------------------------------------------------------
// Reports always; failures optional via -PspotbugsErrors
spotbugs {
	ignoreFailures = !project.hasProperty('spotbugsErrors')
	excludeFilter = rootProject.file('config/spotbugs/exclude.xml')
}

['spotbugsMain', 'spotbugsTest'].each { taskName ->
	tasks.matching { it.name == taskName }.configureEach { task ->
		task.reports { reports ->
			reports.maybeCreate('html').required = true
			reports.maybeCreate('xml').required = true
		}
	}
}
