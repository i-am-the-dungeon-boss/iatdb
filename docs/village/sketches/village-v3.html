<svg viewBox="0 0 660 700" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <pattern id="grass" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#4a6b3c"/>
      <circle cx="1" cy="1" r="0.6" fill="#6a9556"/>
      <circle cx="4" cy="4" r="0.6" fill="#6a9556"/>
    </pattern>
    <pattern id="forest" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#233a1c"/>
      <circle cx="3" cy="3" r="2" fill="#2f4d24"/>
      <circle cx="7" cy="7" r="2" fill="#2f4d24"/>
    </pattern>
    <pattern id="carpet" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#7a1f1f"/>
      <rect x="0" y="0" width="6" height="1" fill="#d4a63a"/>
    </pattern>
    <pattern id="dirtpath" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#8a6a3a"/>
      <circle cx="2" cy="2" r="0.6" fill="#6b4f28"/>
      <circle cx="5" cy="4" r="0.6" fill="#6b4f28"/>
    </pattern>
    <pattern id="plaza" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#b8a985"/>
      <rect x="0" y="0" width="8" height="1" fill="#8f7f5c"/>
      <rect x="0" y="0" width="1" height="8" fill="#8f7f5c"/>
    </pattern>
    <pattern id="water" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#2b4a7a"/>
      <path d="M0 4 Q3 2 6 4 T12 4" stroke="#4a72b8" stroke-width="0.8" fill="none"/>
      <path d="M0 9 Q3 7 6 9 T12 9" stroke="#4a72b8" stroke-width="0.8" fill="none"/>
    </pattern>
    <pattern id="sand" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#d9c58a"/>
      <circle cx="2" cy="2" r="0.5" fill="#b8a465"/>
      <circle cx="5" cy="4" r="0.5" fill="#b8a465"/>
    </pattern>
    <pattern id="planks" width="14" height="6" patternUnits="userSpaceOnUse">
      <rect width="14" height="6" fill="#7a5230"/>
      <rect x="0" y="0" width="1" height="6" fill="#3a2415"/>
      <rect x="13" y="0" width="1" height="6" fill="#3a2415"/>
    </pattern>
  </defs>

  <!-- Frame + forest -->
  <rect x="20" y="20" width="620" height="620" fill="url(#forest)"/>
  <rect x="38" y="38" width="584" height="584" fill="url(#grass)"/>

  <!-- North forest belt -->
  <rect x="38" y="38" width="584" height="80" fill="url(#forest)" opacity="0.85"/>
  <!-- West forest belt (with a cut for the path) -->
  <rect x="38" y="118" width="80" height="424" fill="url(#forest)" opacity="0.85"/>
  <!-- East forest belt (with a cut for the path) -->
  <rect x="542" y="118" width="80" height="424" fill="url(#forest)" opacity="0.85"/>

  <!-- South shore: sand strip then water -->
  <rect x="38" y="500" width="584" height="30" fill="url(#sand)"/>
  <rect x="38" y="530" width="584" height="92" fill="url(#water)"/>

  <!-- Camera clamp -->
  <rect x="118" y="118" width="424" height="382" fill="none" stroke="#f5c542" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.7"/>
  <text x="330" y="112" text-anchor="middle" font-size="10" fill="#f5c542">camera pan clamp — forest north/east/west, sea south</text>

  <!-- Dungeon gatehouse, top-center -->
  <rect x="270" y="128" width="120" height="70" fill="#5d5148" stroke="#2b241f" stroke-width="2"/>
  <rect x="315" y="178" width="30" height="20" fill="#1a1310"/>
  <text x="330" y="164" text-anchor="middle" font-size="11" fill="#f4e4c1" font-weight="bold">DUNGEON</text>
  <text x="330" y="176" text-anchor="middle" font-size="8" fill="#f4e4c1">gate → WndDungeonMode</text>

  <!-- Path dungeon → plaza -->
  <rect x="322" y="198" width="16" height="110" fill="url(#carpet)"/>

  <!-- Echo plaza -->
  <circle cx="330" cy="370" r="85" fill="url(#plaza)" stroke="#6b5c40" stroke-width="2"/>
  <text x="330" y="330" text-anchor="middle" font-size="12" fill="#2b241f" font-weight="bold">ECHO PLAZA</text>
  <g fill="#8a7a5a" stroke="#4a3d28">
    <rect x="290" y="348" width="14" height="14"/>
    <rect x="318" y="340" width="14" height="14"/>
    <rect x="346" y="340" width="14" height="14"/>
    <rect x="372" y="348" width="14" height="14"/>
    <rect x="298" y="378" width="14" height="14"/>
    <rect x="326" y="388" width="14" height="14"/>
    <rect x="354" y="388" width="14" height="14"/>
    <rect x="378" y="378" width="14" height="14"/>
  </g>
  <text x="330" y="408" text-anchor="middle" font-size="8" fill="#2b241f">figures + stored echoes</text>

  <!-- Side wood-paths: fade into forest east and west (decorative, non-walkable off-map) -->
  <rect x="230" y="362" width="100" height="16" fill="url(#dirtpath)"/>
  <rect x="330" y="362" width="212" height="16" fill="url(#dirtpath)"/>
  <!-- fade tips into forest -->
  <rect x="118" y="362" width="12" height="16" fill="url(#forest)" opacity="0.6"/>
  <rect x="530" y="362" width="12" height="16" fill="url(#forest)" opacity="0.6"/>
  <text x="130" y="358" font-size="8" fill="#f4e4c1">to the woods →</text>
  <text x="470" y="358" font-size="8" fill="#f4e4c1">to the woods →</text>

  <!-- Guild, northwest -->
  <rect x="140" y="230" width="110" height="80" fill="#6b4a2b" stroke="#2b241f" stroke-width="2"/>
  <polygon points="140,230 195,210 250,230" fill="#8a5a30" stroke="#2b241f" stroke-width="2"/>
  <rect x="187" y="285" width="16" height="25" fill="#1a1310"/>
  <text x="195" y="262" text-anchor="middle" font-size="12" fill="#f4e4c1" font-weight="bold">GUILD</text>
  <text x="195" y="276" text-anchor="middle" font-size="8" fill="#f4e4c1">crier · leaderboard</text>

  <!-- Smithy, northeast -->
  <rect x="410" y="230" width="100" height="80" fill="#4a4038" stroke="#2b241f" stroke-width="2"/>
  <rect x="412" y="232" width="24" height="24" fill="#c94a1a"/>
  <text x="460" y="272" text-anchor="middle" font-size="12" fill="#f4e4c1" font-weight="bold">SMITHY</text>
  <text x="460" y="286" text-anchor="middle" font-size="8" fill="#f4e4c1">forge glow</text>

  <!-- Elder cottage, west of plaza (small) -->
  <rect x="150" y="410" width="70" height="55" fill="#5d4a2b" stroke="#2b241f" stroke-width="2"/>
  <polygon points="150,410 185,395 220,410" fill="#7a5f38" stroke="#2b241f" stroke-width="2"/>
  <text x="185" y="442" text-anchor="middle" font-size="10" fill="#f4e4c1" font-weight="bold">ELDER</text>

  <!-- Player house, east of plaza -->
  <rect x="440" y="410" width="80" height="55" fill="#4a3d28" stroke="#2b241f" stroke-width="2"/>
  <polygon points="440,410 480,393 520,410" fill="#6b5940" stroke="#2b241f" stroke-width="2"/>
  <text x="480" y="442" text-anchor="middle" font-size="10" fill="#f4e4c1" font-weight="bold">HOUSE</text>

  <!-- Tavern, south by the shore -->
  <rect x="380" y="450" width="120" height="45" fill="#7a4a2b" stroke="#2b241f" stroke-width="2"/>
  <polygon points="380,450 440,432 500,450" fill="#a05a30" stroke="#2b241f" stroke-width="2"/>
  <rect x="432" y="470" width="16" height="25" fill="#1a1310"/>
  <text x="440" y="465" text-anchor="middle" font-size="11" fill="#f4e4c1" font-weight="bold">TAVERN</text>
  <text x="440" y="486" text-anchor="middle" font-size="8" fill="#f4e4c1">world chat</text>

  <!-- Path plaza → tavern → dock -->
  <rect x="322" y="455" width="16" height="50" fill="url(#carpet)"/>

  <!-- Dock: planks jut south from tavern onto/over water -->
  <rect x="432" y="500" width="18" height="100" fill="url(#planks)" stroke="#3a2415"/>
  <g fill="#3a2415">
    <rect x="431" y="530" width="3" height="4"/>
    <rect x="448" y="530" width="3" height="4"/>
    <rect x="431" y="565" width="3" height="4"/>
    <rect x="448" y="565" width="3" height="4"/>
  </g>
  <!-- boat moored -->
  <ellipse cx="470" cy="595" rx="18" ry="7" fill="#5d3a1c" stroke="#2b1a0d"/>
  <rect x="468" y="572" width="2" height="23" fill="#2b1a0d"/>
  <polygon points="470,574 486,590 470,590" fill="#f4e4c1" stroke="#2b1a0d"/>
  <text x="470" y="618" text-anchor="middle" font-size="8" fill="#f4e4c1">dock</text>

  <!-- Legend -->
  <g transform="translate(30, 655)" font-size="10" fill="#1a1310">
    <rect x="0" y="0" width="600" height="35" fill="#efe6d0" stroke="#8f7f5c"/>
    <rect x="8" y="6" width="14" height="8" fill="url(#forest)"/><text x="26" y="14">forest</text>
    <rect x="70" y="6" width="14" height="8" fill="url(#water)"/><text x="88" y="14">sea</text>
    <rect x="120" y="6" width="14" height="8" fill="url(#sand)"/><text x="138" y="14">shore</text>
    <rect x="180" y="6" width="14" height="8" fill="url(#planks)"/><text x="198" y="14">dock</text>
    <rect x="240" y="6" width="14" height="8" fill="url(#carpet)"/><text x="258" y="14">carpet path</text>
    <rect x="315" y="6" width="14" height="8" fill="url(#dirtpath)"/><text x="333" y="14">dirt wood-path</text>
    <rect x="410" y="6" width="14" height="8" fill="url(#plaza)"/><text x="428" y="14">plaza</text>
    <rect x="465" y="6" width="14" height="8" fill="url(#grass)"/><text x="483" y="14">grass</text>
    <text x="8" y="28">No village gate. Dirt paths trail east and west into the forest (decorative fade). South is shoreline with a dock off the tavern.</text>
  </g>

  <text x="330" y="34" text-anchor="middle" font-size="11" fill="#f4e4c1">N ↑</text>
</svg>
