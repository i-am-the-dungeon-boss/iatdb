<svg viewBox="0 0 660 700" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <pattern id="grass" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#4a6b3c"/>
      <circle cx="1" cy="1" r="0.6" fill="#6a9556"/>
      <circle cx="4" cy="4" r="0.6" fill="#6a9556"/>
    </pattern>
    <pattern id="forest" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#233a1c"/>
      <circle cx="3" cy="3" r="2" fill="#2f4d24"/>
      <circle cx="7" cy="7" r="2" fill="#2f4d24"/>
    </pattern>
    <pattern id="carpet" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#7a1f1f"/>
      <rect x="0" y="0" width="6" height="1" fill="#d4a63a"/>
    </pattern>
    <pattern id="plaza" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#b8a985"/>
      <rect x="0" y="0" width="8" height="1" fill="#8f7f5c"/>
      <rect x="0" y="0" width="1" height="8" fill="#8f7f5c"/>
    </pattern>
  </defs>

  <!-- Frame -->
  <rect x="20" y="20" width="620" height="620" fill="url(#forest)"/>

  <!-- Grass interior (33x33 grid = tile size 18) -->
  <rect x="38" y="38" width="584" height="584" fill="url(#grass)"/>

  <!-- Outer forest ring inside walkable bounds: reads as "endless" beyond camera clamp -->
  <rect x="38" y="38" width="584" height="80" fill="url(#forest)" opacity="0.85"/>
  <rect x="38" y="542" width="584" height="80" fill="url(#forest)" opacity="0.85"/>
  <rect x="38" y="118" width="80" height="424" fill="url(#forest)" opacity="0.85"/>
  <rect x="542" y="118" width="80" height="424" fill="url(#forest)" opacity="0.85"/>

  <!-- Camera pan clamp (dashed) -->
  <rect x="118" y="118" width="424" height="424" fill="none" stroke="#f5c542" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.7"/>
  <text x="330" y="112" text-anchor="middle" font-size="10" fill="#f5c542">camera pan clamp — player can't scroll past forest</text>

  <!-- Dungeon gatehouse, top-center -->
  <rect x="270" y="128" width="120" height="70" fill="#5d5148" stroke="#2b241f" stroke-width="2"/>
  <rect x="315" y="178" width="30" height="20" fill="#1a1310"/>
  <text x="330" y="164" text-anchor="middle" font-size="11" fill="#f4e4c1" font-weight="bold">DUNGEON</text>
  <text x="330" y="176" text-anchor="middle" font-size="8" fill="#f4e4c1">gate → WndDungeonMode</text>

  <!-- Carpet path, dungeon → plaza -->
  <rect x="322" y="198" width="16" height="120" fill="url(#carpet)"/>

  <!-- Echo plaza (central) -->
  <circle cx="330" cy="380" r="90" fill="url(#plaza)" stroke="#6b5c40" stroke-width="2"/>
  <text x="330" y="336" text-anchor="middle" font-size="12" fill="#2b241f" font-weight="bold">ECHO PLAZA</text>
  <!-- pedestals -->
  <g fill="#8a7a5a" stroke="#4a3d28">
    <rect x="286" y="356" width="14" height="14"/>
    <rect x="316" y="346" width="14" height="14"/>
    <rect x="346" y="346" width="14" height="14"/>
    <rect x="376" y="356" width="14" height="14"/>
    <rect x="296" y="388" width="14" height="14"/>
    <rect x="326" y="398" width="14" height="14"/>
    <rect x="356" y="398" width="14" height="14"/>
    <rect x="386" y="388" width="14" height="14"/>
  </g>
  <text x="330" y="418" text-anchor="middle" font-size="8" fill="#2b241f">figures + stored echoes on pedestals</text>

  <!-- Guild hall, left -->
  <rect x="140" y="260" width="120" height="90" fill="#6b4a2b" stroke="#2b241f" stroke-width="2"/>
  <polygon points="140,260 200,235 260,260" fill="#8a5a30" stroke="#2b241f" stroke-width="2"/>
  <rect x="192" y="325" width="16" height="25" fill="#1a1310"/>
  <text x="200" y="298" text-anchor="middle" font-size="12" fill="#f4e4c1" font-weight="bold">GUILD</text>
  <text x="200" y="312" text-anchor="middle" font-size="8" fill="#f4e4c1">titles crier · leaderboard</text>

  <!-- Tavern, right -->
  <rect x="400" y="260" width="120" height="90" fill="#7a4a2b" stroke="#2b241f" stroke-width="2"/>
  <polygon points="400,260 460,235 520,260" fill="#a05a30" stroke="#2b241f" stroke-width="2"/>
  <rect x="452" y="325" width="16" height="25" fill="#1a1310"/>
  <text x="460" y="298" text-anchor="middle" font-size="12" fill="#f4e4c1" font-weight="bold">TAVERN</text>
  <text x="460" y="312" text-anchor="middle" font-size="8" fill="#f4e4c1">world chat · gather</text>

  <!-- Side paths from plaza to guild/tavern -->
  <rect x="240" y="372" width="90" height="16" fill="url(#carpet)"/>
  <rect x="330" y="372" width="90" height="16" fill="url(#carpet)"/>

  <!-- Smithy, lower-left -->
  <rect x="150" y="440" width="90" height="60" fill="#4a4038" stroke="#2b241f" stroke-width="2"/>
  <rect x="152" y="442" width="20" height="20" fill="#c94a1a"/>
  <text x="195" y="475" text-anchor="middle" font-size="11" fill="#f4e4c1" font-weight="bold">SMITHY</text>

  <!-- Elder cottage, lower-right -->
  <rect x="420" y="440" width="90" height="60" fill="#5d4a2b" stroke="#2b241f" stroke-width="2"/>
  <polygon points="420,440 465,420 510,440" fill="#7a5f38" stroke="#2b241f" stroke-width="2"/>
  <text x="465" y="475" text-anchor="middle" font-size="11" fill="#f4e4c1" font-weight="bold">ELDER</text>

  <!-- Path plaza → south / player house -->
  <rect x="322" y="470" width="16" height="90" fill="url(#carpet)"/>

  <!-- Player house, south -->
  <rect x="290" y="560" width="80" height="50" fill="#4a3d28" stroke="#2b241f" stroke-width="2"/>
  <polygon points="290,560 330,540 370,560" fill="#6b5940" stroke="#2b241f" stroke-width="2"/>
  <rect x="322" y="585" width="16" height="25" fill="#1a1310"/>
  <text x="330" y="580" text-anchor="middle" font-size="10" fill="#f4e4c1" font-weight="bold">YOUR HOUSE</text>

  <!-- Legend -->
  <g transform="translate(30, 655)" font-size="10" fill="#1a1310">
    <rect x="0" y="0" width="600" height="35" fill="#efe6d0" stroke="#8f7f5c"/>
    <rect x="8" y="6" width="14" height="8" fill="url(#forest)"/><text x="26" y="14">forest belt (endless-look, blocks pan)</text>
    <rect x="200" y="6" width="14" height="8" fill="url(#carpet)"/><text x="218" y="14">carpet path</text>
    <rect x="290" y="6" width="14" height="8" fill="url(#plaza)"/><text x="308" y="14">plaza stone</text>
    <rect x="380" y="6" width="14" height="8" fill="url(#grass)"/><text x="398" y="14">grass / decor filler</text>
    <rect x="480" y="6" width="14" height="8" fill="none" stroke="#f5c542" stroke-dasharray="3 2"/><text x="498" y="14">camera clamp</text>
    <text x="8" y="28">Grid = 33×33 tiles · 1 tile ≈ 18 px. Player spawns at their house (south) and walks through plaza to any district.</text>
  </g>

  <!-- North label -->
  <text x="330" y="34" text-anchor="middle" font-size="11" fill="#f4e4c1">N ↑</text>
</svg>
