  <defs>
    <pattern id="pz" width="14" height="14" patternUnits="userSpaceOnUse">

      <rect width="1.5" height="14" fill="#95866190"/>

    <pattern id="tSew" width="21" height="21" patternUnits="userSpaceOnUse">
      <rect width="21" height="21" fill="#3d6b5e"/>
      <rect width="21" height="2" fill="#2a4c42"/><rect width="2" height="21" fill="#2a4c42"/>
      <circle cx="14" cy="13" r="1.6" fill="#5c9182"/>
    </pattern>
    <pattern id="tPri" width="21" height="21" patternUnits="userSpaceOnUse">
      <rect width="21" height="21" fill="#8a6a48"/>
      <rect width="21" height="2" fill="#5f4830"/><rect width="2" height="21" fill="#5f4830"/>
      <rect x="10" y="10" width="7" height="2" fill="#a68356"/>
    </pattern>
    <pattern id="tCav" width="21" height="21" patternUnits="userSpaceOnUse">
      <rect width="21" height="21" fill="#57473a"/>
      <rect width="21" height="2" fill="#3a2e25"/><rect width="2" height="21" fill="#3a2e25"/>
      <circle cx="13" cy="8" r="2" fill="#a8541f"/>
    </pattern>
    <pattern id="tCit" width="21" height="21" patternUnits="userSpaceOnUse">
      <rect width="21" height="21" fill="#6a5a8a"/>
      <rect width="21" height="2" fill="#463a5e"/><rect width="2" height="21" fill="#463a5e"/>
      <rect x="11" y="11" width="5" height="5" fill="#d4a63a" opacity="0.65"/>
    </pattern>
    <pattern id="tHal" width="21" height="21" patternUnits="userSpaceOnUse">
      <rect width="21" height="21" fill="#3a1f2a"/>
      <rect width="21" height="2" fill="#22121a"/><rect width="2" height="21" fill="#22121a"/>
      <circle cx="13" cy="12" r="2" fill="#a8321f"/>

    <pattern id="carp" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#7a1f1f"/>
      <rect width="14" height="2" fill="#d4a63a"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="700" height="830" fill="#1c1a17"/>

  <text x="333" y="34" text-anchor="middle" font-size="17" fill="#f4e4c1" font-weight="bold">THE ECHO ALTAR — 13 × 13 tiles, centre of the village</text>
  <text x="333" y="54" text-anchor="middle" font-size="11" fill="#c9b98f">Each boss stands on a 3×3 pad of its own region's tileset · Halls boss on the Dwarf King's throne at centre</text>

  <!-- plaza base -->
  <rect x="60" y="90" width="546" height="546" fill="url(#pz)" stroke="#6b5c40" stroke-width="2"/>

  <!-- tile grid -->
  <g stroke="#00000018" stroke-width="1">
    <line x1="102" y1="90" x2="102" y2="636"/><line x1="144" y1="90" x2="144" y2="636"/>
    <line x1="186" y1="90" x2="186" y2="636"/><line x1="228" y1="90" x2="228" y2="636"/>
    <line x1="270" y1="90" x2="270" y2="636"/><line x1="312" y1="90" x2="312" y2="636"/>
    <line x1="354" y1="90" x2="354" y2="636"/><line x1="396" y1="90" x2="396" y2="636"/>
    <line x1="438" y1="90" x2="438" y2="636"/><line x1="480" y1="90" x2="480" y2="636"/>
    <line x1="522" y1="90" x2="522" y2="636"/><line x1="564" y1="90" x2="564" y2="636"/>
    <line x1="60" y1="132" x2="606" y2="132"/><line x1="60" y1="174" x2="606" y2="174"/>
    <line x1="60" y1="216" x2="606" y2="216"/><line x1="60" y1="258" x2="606" y2="258"/>
    <line x1="60" y1="300" x2="606" y2="300"/><line x1="60" y1="342" x2="606" y2="342"/>
    <line x1="60" y1="384" x2="606" y2="384"/><line x1="60" y1="426" x2="606" y2="426"/>
    <line x1="60" y1="468" x2="606" y2="468"/><line x1="60" y1="510" x2="606" y2="510"/>
    <line x1="60" y1="552" x2="606" y2="552"/><line x1="60" y1="594" x2="606" y2="594"/>
  </g>

  <!-- approach carpet from north (from the dungeon path) -->
  <rect x="312" y="90" width="42" height="210" fill="url(#carp)" opacity="0.9"/>
  <text x="333" y="82" text-anchor="middle" font-size="10" fill="#f5c542">↑ path from dungeon gate</text>

  <!-- ===== NW pad: SEWERS / Goo ===== -->
  <rect x="102" y="132" width="126" height="126" fill="url(#tSew)" stroke="#1d3830" stroke-width="3"/>
  <g>
    <ellipse cx="165" cy="205" rx="26" ry="20" fill="#4a9c3a" stroke="#2c6322" stroke-width="2"/>
    <ellipse cx="165" cy="188" rx="20" ry="14" fill="#5cb845"/>
    <circle cx="165" cy="190" r="6" fill="#0d1a0a"/><circle cx="167" cy="188" r="2" fill="#c9f5b8"/>
    <ellipse cx="165" cy="226" rx="28" ry="5" fill="#00000055"/>
  </g>
  <rect x="102" y="112" width="126" height="18" fill="#1d3830" rx="3"/>
  <text x="165" y="125" text-anchor="middle" font-size="11" fill="#8fd4bf" font-weight="bold">SEWERS · GOO</text>
  <text x="165" y="272" text-anchor="middle" font-size="9" fill="#3d6b5e">tiles_sewers.png · depths 1–5</text>

  <!-- ===== NE pad: PRISON / Tengu ===== -->
  <rect x="438" y="132" width="126" height="126" fill="url(#tPri)" stroke="#4a3625" stroke-width="3"/>
  <g>
    <rect x="489" y="192" width="24" height="30" fill="#22242e" stroke="#0e0f14" stroke-width="1.5"/>
    <rect x="493" y="176" width="16" height="16" fill="#d9cfc0" stroke="#0e0f14" stroke-width="1.5"/>
    <rect x="496" y="181" width="4" height="3" fill="#a8321f"/><rect x="502" y="181" width="4" height="3" fill="#a8321f"/>
    <path d="M497 187 L505 187 L501 190 Z" fill="#a8321f"/>
    <rect x="483" y="198" width="7" height="4" fill="#22242e"/><rect x="512" y="198" width="7" height="4" fill="#22242e"/>
    <ellipse cx="501" cy="226" rx="20" ry="5" fill="#00000055"/>
  </g>
  <rect x="438" y="112" width="126" height="18" fill="#4a3625" rx="3"/>
  <text x="501" y="125" text-anchor="middle" font-size="11" fill="#e0c69a" font-weight="bold">PRISON · TENGU</text>
  <text x="501" y="272" text-anchor="middle" font-size="9" fill="#8a6a48">tiles_prison.png · depths 6–10</text>

  <!-- ===== SW pad: CITY / Dwarf King ===== -->
  <rect x="102" y="468" width="126" height="126" fill="url(#tCit)" stroke="#3a3050" stroke-width="3"/>
  <g>
    <rect x="152" y="528" width="26" height="28" fill="#5c3f6e" stroke="#2e1f38" stroke-width="1.5"/>
    <circle cx="165" cy="519" r="11" fill="#e0c9a8" stroke="#2e1f38" stroke-width="1.5"/>
    <rect x="158" y="530" width="14" height="8" fill="#c9b8a0"/>
    <path d="M154 510 L157 500 L161 507 L165 498 L169 507 L173 500 L176 510 Z" fill="#f5c542" stroke="#8a6a1a" stroke-width="1.2"/>
    <circle cx="161" cy="518" r="1.8" fill="#1a1310"/><circle cx="169" cy="518" r="1.8" fill="#1a1310"/>
    <ellipse cx="165" cy="560" rx="20" ry="5" fill="#00000055"/>
  </g>
  <rect x="102" y="448" width="126" height="18" fill="#3a3050" rx="3"/>
  <text x="165" y="461" text-anchor="middle" font-size="11" fill="#c9b0e8" font-weight="bold">CITY · DWARF KING</text>
  <text x="165" y="610" text-anchor="middle" font-size="9" fill="#6a5a8a">tiles_city.png · depths 16–20</text>

  <!-- ===== SE pad: CAVES / DM-300 ===== -->
  <rect x="438" y="468" width="126" height="126" fill="url(#tCav)" stroke="#2e251d" stroke-width="3"/>
  <g>
    <rect x="484" y="520" width="34" height="30" fill="#6b6b6b" stroke="#2b2b2b" stroke-width="2"/>
    <rect x="490" y="512" width="22" height="10" fill="#8a8a8a" stroke="#2b2b2b" stroke-width="1.5"/>
    <circle cx="501" cy="533" r="6" fill="#c9541f" stroke="#2b2b2b" stroke-width="1.5"/>
    <circle cx="501" cy="533" r="2.5" fill="#f5c542"/>
    <rect x="478" y="527" width="6" height="14" fill="#5a5a5a"/><rect x="518" y="527" width="6" height="14" fill="#5a5a5a"/>
    <ellipse cx="501" cy="556" rx="24" ry="5" fill="#00000055"/>
  </g>
  <rect x="438" y="448" width="126" height="18" fill="#2e251d" rx="3"/>
  <text x="501" y="461" text-anchor="middle" font-size="11" fill="#e3a678" font-weight="bold">CAVES · DM-300</text>
  <text x="501" y="610" text-anchor="middle" font-size="9" fill="#8a7256">tiles_caves.png · depths 11–15</text>

  <!-- ===== CENTRE: throne on halls ground, Yog seated ===== -->
  <rect x="270" y="300" width="126" height="126" fill="url(#tHal)" stroke="#5a1f1f" stroke-width="3"/>
  <!-- throne carpet 3 wide (city_boss.png rows 13/14/15, cols 1..3) -->
  <rect x="291" y="321" width="84" height="84" fill="url(#carp)" stroke="#d4a63a" stroke-width="1.5"/>
  <!-- throne chair -->
  <g>
    <rect x="312" y="330" width="42" height="46" fill="#5a4a2e" stroke="#2b241f" stroke-width="2"/>
    <rect x="306" y="368" width="54" height="12" fill="#4a3d28" stroke="#2b241f" stroke-width="2"/>
    <rect x="316" y="322" width="34" height="10" fill="#f5c542" opacity="0.85"/>
  </g>
  <!-- Yog seated on it -->
  <g>
    <ellipse cx="333" cy="352" rx="24" ry="21" fill="#7a2b3a" stroke="#3a121c" stroke-width="2"/>
    <ellipse cx="333" cy="352" rx="15" ry="13" fill="#c9541f"/>
    <circle cx="333" cy="352" r="8" fill="#f5e0a8"/>
    <circle cx="333" cy="352" r="4" fill="#1a0d0d"/>
    <path d="M312 340 Q305 330 313 326" stroke="#7a2b3a" stroke-width="4" fill="none"/>
    <path d="M354 340 Q361 330 353 326" stroke="#7a2b3a" stroke-width="4" fill="none"/>
    <ellipse cx="333" cy="380" rx="26" ry="6" fill="#00000066"/>
  </g>
  <rect x="270" y="280" width="126" height="18" fill="#5a1f1f" rx="3"/>
  <text x="333" y="293" text-anchor="middle" font-size="11" fill="#f5c542" font-weight="bold">HALLS · YOG-DZEWA</text>
  <text x="333" y="440" text-anchor="middle" font-size="9" fill="#c9a08f">throne = city_boss.png 13·8+1..3 / 14·8+1..3 / 15·8+1..3</text>
  <text x="333" y="452" text-anchor="middle" font-size="9" fill="#c9a08f">ground = tiles_halls.png · depths 21–25</text>

  <!-- echo depth posts: one pedestal beside each pad -->
  <g fill="#8a7a5a" stroke="#4a3d28" stroke-width="1.5">
    <rect x="240" y="186" width="18" height="18"/>
    <rect x="408" y="186" width="18" height="18"/>
    <rect x="240" y="522" width="18" height="18"/>
    <rect x="408" y="522" width="18" height="18"/>
    <rect x="324" y="258" width="18" height="18"/>
  </g>
  <text x="249" y="180" text-anchor="middle" font-size="8" fill="#5a4a2e">post</text>
  <text x="417" y="180" text-anchor="middle" font-size="8" fill="#5a4a2e">post</text>
  <text x="249" y="516" text-anchor="middle" font-size="8" fill="#5a4a2e">post</text>
  <text x="417" y="516" text-anchor="middle" font-size="8" fill="#5a4a2e">post</text>
  <text x="333" y="252" text-anchor="middle" font-size="8" fill="#5a4a2e">post</text>

  <!-- legend -->
  <g transform="translate(60, 660)">
    <rect x="0" y="0" width="546" height="150" fill="#efe6d0" stroke="#8f7f5c" rx="4"/>
    <text x="12" y="20" font-size="12" fill="#1a1310" font-weight="bold">How it's built</text>
    <text x="12" y="40" font-size="10.5" fill="#2b241f">• 5 × CustomTilemap, one per pad, each with its own region texture (TILES_SEWERS / _PRISON / _CAVES / _CITY / _HALLS).</text>
    <text x="12" y="57" font-size="10.5" fill="#2b241f">• 6th CustomTilemap = the throne, texture CITY_BOSS, over Terrain.CUSTOM_DECO — same recipe as CityBossLevel.</text>
    <text x="12" y="74" font-size="10.5" fill="#2b241f">• Bosses are decorative: VillageEcho-style PASSIVE + IMMOVABLE NPCs, so they stay inspectable and get name/desc on tap.</text>
    <text x="12" y="91" font-size="10.5" fill="#2b241f">• Base map under every pad stays a walkable floor terrain — the custom tiles are purely a visual layer on top.</text>
    <text x="12" y="112" font-size="12" fill="#1a1310" font-weight="bold">Layout logic</text>
    <text x="12" y="130" font-size="10.5" fill="#2b241f">Corners run clockwise by depth from the NW: Sewers → Prison → Caves → City, with the Halls boss raised at centre.</text>
    <text x="12" y="144" font-size="10.5" fill="#2b241f">The 5 pedestals map 1:1 onto the 5 existing DEPTH_POSTS — each region's echo stands beside its own boss.</text>
  </g>
</svg>
