buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.1.0'
        classpath 'io.sentry:sentry-android-gradle-plugin:6.15.0'
    }
}

plugins {
    id 'com.diffplug.spotless' version '8.9.0' apply false
    id 'net.ltgt.errorprone' version '5.1.0' apply false
    id 'com.github.spotbugs' version '6.5.9' apply false
}

// :desktop:debug → build-debug/<module>/ so a parallel :core:test can keep using build/.
def desktopDebugRequested = gradle.startParameter.taskNames.any { name ->
    def n = name.toLowerCase(Locale.ROOT)
    n == 'debug' || n == 'desktop:debug' || n == ':desktop:debug' || n.endsWith(':desktop:debug')
}
if (desktopDebugRequested) {
    logger.lifecycle('desktop:debug → outputs under build-debug/ (tests can use build/ in parallel)')
}

allprojects {

    ext {
        appName = 'I am the Dungeon Boss'
        appPackageName = 'com.dungeonboss.iatdb'

        // Versioning: 0.0.N = alpha, 0.1.N = beta, 1.0.N = first public release.
        // Keep appVersionName in sync with hero-echoes package.json when shipping online.
		appVersionName = '0.1.0'
        // Play upload code. Was pinned to Shattered's 896; raised for our own uploads.
        // Also stamped into saves as Game.versionCode.
        appVersionCode = 898

        appJavaCompatibility = JavaVersion.VERSION_11

        appAndroidCompileSDK = 36   //Android 15
        appAndroidMinSDK = 21       //Android 5.0
        appAndroidTargetSDK = 36    //Android 15

        gdxVersion = '1.14.0'
        gdxControllersVersion = '2.2.4'
        robovmVersion = '2.3.24'
    }
    version = appVersionName

    repositories {
        google()
        mavenCentral()
        maven { url 'https://central.sonatype.com/repository/maven-snapshots/' }
    }

    if (desktopDebugRequested) {
        def rel = path == ':' ? '_root' : path.substring(1).replace(':', '/')
        layout.buildDirectory.set(rootProject.layout.projectDirectory.dir("build-debug/${rel}"))
    }

}

// Store builds:
//   ./gradlew prepareRelease          Play AAB (full game; do not pass -Pdemo)
//   ./gradlew packageSteamDemo -Pdemo Steam demo zip for this OS (Windows, or Linux/SteamOS)
// End-to-end tag + GitHub Release (notes + store links, no binaries):
//   .\scripts\release.ps1
//
// Release builds always upload Sentry source context (+ Android ProGuard maps).
// SENTRY_AUTH_TOKEN is required (env or root .env) — not optional.

def resolveSentryAuthToken = {
    def token = System.getenv('SENTRY_AUTH_TOKEN')
    if (token != null && !token.trim().isEmpty()) {
        return token.trim()
    }
    def envFile = rootProject.file('.env')
    if (envFile.isFile()) {
        def found = null
        envFile.eachLine('UTF-8') { line ->
            def trimmed = line.trim()
            if (trimmed.startsWith('SENTRY_AUTH_TOKEN=')) {
                found = trimmed.substring('SENTRY_AUTH_TOKEN='.length()).trim()
                if ((found.startsWith('"') && found.endsWith('"'))
                        || (found.startsWith("'") && found.endsWith("'"))) {
                    found = found.substring(1, found.length() - 1)
                }
            }
        }
        if (found != null && !found.trim().isEmpty()) {
            return found.trim()
        }
    }
    return null
}

gradle.taskGraph.whenReady { graph ->
    def releaseNeedsSentry = graph.allTasks.any { task ->
        def path = task.path
        path == ':prepareRelease' ||
                path == ':packageSteamDemo' ||
                path == ':android:assembleRelease' ||
                path == ':android:bundleRelease' ||
                path == ':desktop:release' ||
                path == ':ios:createIPA' ||
                task.name.startsWith('sentryUpload')
    }
    if (releaseNeedsSentry) {
        def token = resolveSentryAuthToken()
        if (token == null) {
            throw new GradleException(
                    'Release builds require SENTRY_AUTH_TOKEN (env or root .env) so Sentry source context uploads. '
                            + 'Create a token at https://sentry.io/settings/dungeonboss/auth-tokens/')
        }
        logger.lifecycle('Sentry: SENTRY_AUTH_TOKEN present — source uploads required for this release build.')
    }
}

gradle.projectsEvaluated {
    def androidProject = findProject(':android')
    def desktopProject = findProject(':desktop')

    tasks.register('prepareRelease') {
        group = 'distribution'
        description = 'Build the Play Store AAB (full game, no -Pdemo) into dist/<version>/'

        if (androidProject != null) {
            dependsOn ':android:bundleRelease'
        }

        doFirst {
            if (project.hasProperty('demo')) {
                throw new GradleException(
                        'prepareRelease builds the Play AAB and must not be run with -Pdemo.')
            }
            if (androidProject == null) {
                throw new GradleException(
                        'prepareRelease needs :android (set sdk.dir in local.properties or ANDROID_HOME).')
            }
            def keystoreProps = androidProject.file('keystore.properties')
            if (!keystoreProps.exists()) {
                throw new GradleException(
                        'Missing android/keystore.properties — copy keystore.properties.example and add the release keystore (see docs/release/android-signing.md).')
            }
        }

        doLast {
            def versionName = rootProject.ext.appVersionName
            def versionCode = rootProject.ext.appVersionCode
            def outDir = rootProject.file("dist/${versionName}")
            delete outDir
            outDir.mkdirs()

            def bundleDir = androidProject.file('build/outputs/bundle/release')
            def aab = fileTree(bundleDir) {
                include '*.aab'
            }.files.find { true }
            if (aab == null || !aab.exists()) {
                throw new GradleException("No signed release AAB found under ${bundleDir}")
            }
            def aabDest = new File(outDir, "iatdb-${versionName}-android.aab")
            copy { from aab; into outDir; rename { aabDest.name } }

            def manifest = new File(outDir, 'SHA256SUMS.txt')
            def lines = new ArrayList()
            lines.add("appVersionName=${versionName}")
            lines.add("appVersionCode=${versionCode}")
            lines.add("builtAt=${new Date()}")
            lines.add('')
            outDir.listFiles().findAll { it.isFile() && it.name != 'SHA256SUMS.txt' }.sort { it.name }.each { f ->
                def hash = java.security.MessageDigest.getInstance('SHA-256')
                        .digest(f.bytes)
                        .collect { String.format('%02x', it) }
                        .join('')
                lines.add("${hash}  ${f.name}")
            }
            manifest.text = lines.join('\n') + '\n'

            logger.lifecycle('')
            logger.lifecycle("Release artifacts ready in ${outDir}:")
            outDir.listFiles().sort { it.name }.each { f ->
                logger.lifecycle("  - ${f.name} (${f.length()} bytes)")
            }
        }
    }

    tasks.register('packageSteamDemo') {
        group = 'distribution'
        description = 'Zip a -Pdemo jpackage image for Steam (Windows, or Linux which is also SteamOS).'

        dependsOn ':desktop:jpackageImage'

        doFirst {
            if (!project.hasProperty('demo')) {
                throw new GradleException('packageSteamDemo requires -Pdemo (Steam demo builds only).')
            }
            if (desktopProject == null) {
                throw new GradleException('packageSteamDemo needs :desktop.')
            }
        }

        doLast {
            def slug = osFamilySlug()
            if (slug != 'windows' && slug != 'linux') {
                throw new GradleException(
                        "Steam demo packages are Windows and Linux/SteamOS only (this OS is ${slug}).")
            }
            def versionName = rootProject.ext.appVersionName
            def outDir = rootProject.file("dist/${versionName}")
            outDir.mkdirs()
            def imageDir = desktopProject.file('build/jpackage')
            if (!imageDir.exists()) {
                throw new GradleException("Steam demo image missing under ${imageDir}")
            }
            def zipName = "iatdb-${versionName}-steam-demo-${slug}.zip"
            ant.zip(destfile: new File(outDir, zipName)) {
                fileset(dir: imageDir)
            }
            logger.lifecycle("Steam demo zip: ${new File(outDir, zipName)}")
        }
    }

    // Paused: APK + desktop JAR + host jpackage zip + unsigned IPA.
    // dependsOn ':desktop:release'
    // dependsOn ':android:assembleRelease'
    // if (withJpackage) { dependsOn ':desktop:jpackageImage' }
    // if (iosProject != null) { dependsOn ':ios:createIPA' }
    // copy signed apk to iatdb-${versionName}-android.apk from build/outputs/apk/release
    // copy desktop jar to iatdb-${versionName}-desktop.jar
    // zip jpackage to iatdb-${versionName}-desktop-${osFamilySlug()}.zip
    // copy ios ipa to iatdb-${versionName}-ios-unsigned.ipa
}

static String osFamilySlug() {
    def os = System.getProperty('os.name').toLowerCase(Locale.ROOT)
    if (os.contains('win')) return 'windows'
    if (os.contains('mac')) return 'macos'
    if (os.contains('linux')) return 'linux'
    return 'unknown'
}

// Spotless / Error Prone / SpotBugs for JVM modules (java / java-library).
// Skips Android AGP. See gradle/java-quality.gradle.
subprojects { sub ->
    sub.pluginManager.withPlugin('java') {
        if (sub.plugins.hasPlugin('com.android.base')
                || sub.plugins.hasPlugin('com.android.application')
                || sub.plugins.hasPlugin('com.android.library')) {
            return
        }
        sub.apply from: rootProject.file('gradle/java-quality.gradle')
    }
}
